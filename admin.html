<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VexTradeBridge Admin</title><style>body{margin:0;background:#02060d;color:#eef6ff;font-family:Arial;padding:20px}.wrap{max-width:1100px;margin:auto}.card,.prod{background:#071322;border:1px solid #16416c;border-radius:14px;padding:18px;margin:14px 0}.logo{height:60px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}input,select,textarea{width:100%;box-sizing:border-box;background:#03101d;color:#fff;border:1px solid #1b4d7d;border-radius:8px;padding:11px;margin:6px 0 12px}.btn{border:0;border-radius:9px;background:#087ff0;color:#fff;padding:11px 16px;font-weight:bold;cursor:pointer}.danger{background:#b52828}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="index.html"><img class="logo" src="logo.png"></a><h1>VexTradeBridge Admin</h1><div id="login" class="card"><h2>Admin Login</h2><input id="u" placeholder="Benutzername"><input id="p" type="password" placeholder="Passwort"><button class="btn" onclick="login()">Einloggen</button><p id="err"></p></div><div id="panel" class="hidden"><div class="card"><div class="top"><h2>Produkt hinzufügen</h2><button class="btn" onclick="logout()">Logout</button></div><div class="grid"><div><input id="n" placeholder="Produktname"><select id="c"><option>Handys</option><option>PCs</option><option>PC-Hardware</option><option>Tablets</option><option>Laptops</option><option>Monitore</option><option>Konsolen</option><option>Gaming-Zubehör</option></select></div><div><input id="pr" type="number" step="0.01" placeholder="Preis €"><input id="st" type="number" placeholder="Lagerbestand"></div></div><input id="im" placeholder="Direkte Bild-URL (JPG/PNG)"><textarea id="d" placeholder="Beschreibung"></textarea><button class="btn" onclick="add()">Produkt hinzufügen</button></div><div class="card"><h2>Produkte</h2><div id="products"></div></div><div class="card"><h2>Bestellungen</h2><div id="orders"></div></div></div></div><script>const AU='DDCry03',AP='nacnac88';let ps=JSON.parse(localStorage.getItem('vt_products')||'[]');function login(){if(u.value===AU&&p.value===AP){sessionStorage.setItem('vt_admin','1');show()}else err.textContent='Benutzername oder Passwort falsch.'}function show(){loginDiv=document.getElementById('login');loginDiv.classList.add('hidden');panel.classList.remove('hidden');render()}function logout(){sessionStorage.removeItem('vt_admin');location.reload()}function add(){if(!n.value||!pr.value)return alert('Name und Preis ausfüllen.');ps.push({id:'p'+Date.now(),name:n.value,category:c.value,price:Number(pr.value),stock:Number(st.value||0),image:im.value,description:d.value});localStorage.setItem('vt_products',JSON.stringify(ps));n.value=pr.value=st.value=im.value=d.value='';render()}function del(id){ps=ps.filter(x=>x.id!==id);localStorage.setItem('vt_products',JSON.stringify(ps));render()}function edit(id){let x=ps.find(p=>p.id===id);if(!x)return;let price=prompt('Neuer Preis €',x.price),stock=prompt('Neuer Lagerbestand',x.stock),image=prompt('Neue Bild-URL',x.image||'');if(price!==null)x.price=Number(price);if(stock!==null)x.stock=Number(stock);if(image!==null)x.image=image;localStorage.setItem('vt_products',JSON.stringify(ps));render()}function render(){products.innerHTML=ps.map(x=>`<div class="prod"><b>${x.name}</b><div>${x.category} · ${Number(x.price).toLocaleString('de-DE',{style:'currency',currency:'EUR'})} · Bestand: ${x.stock}</div><button class="btn" onclick="edit('${x.id}')">Bearbeiten</button> <button class="btn danger" onclick="del('${x.id}')">Löschen</button></div>`).join('')||'<p>Noch keine Produkte.</p>';let os=JSON.parse(localStorage.getItem('vt_orders')||'[]');orders.innerHTML=os.map(o=>`<div class="prod"><b>${o.order_number}</b><div>${o.name} · ${o.email}</div><div>${o.address}</div><div><b>${Number(o.total).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}</b> · Zahlung: ${o.payment_status} · Versand: ${o.fulfillment_status}</div><small>${new Date(o.created_at).toLocaleString('de-DE')}</small></div>`).join('')||'<p>Noch keine Bestellungen in diesem Browser.</p>'}if(sessionStorage.getItem('vt_admin')==='1')show()</script></body></html>

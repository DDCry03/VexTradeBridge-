<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VexTradeBridge Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#05070a;--card:#0c1118;--line:#1d2733;--red:#ff304f;--text:#f5f7fa;--muted:#9aa6b2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.logo{font-size:24px;font-weight:900}.logo span{color:var(--red)}.btn,.nav{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:800}.btn{background:var(--red);color:#fff}.nav{background:#121a24;color:#fff;border:1px solid var(--line)}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.product{border:1px solid var(--line);border-radius:12px;padding:13px}.product img{width:100%;height:150px;object-fit:contain;background:#111821;border-radius:9px}.muted{color:var(--muted)}input,textarea,select{width:100%;background:#070b10;border:1px solid var(--line);color:#fff;border-radius:9px;padding:11px;margin:5px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.login{max-width:430px;margin:12vh auto}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.danger{background:#42121b}.stat{font-size:26px;font-weight:900}@media(max-width:700px){.formgrid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><div class="logo">Vex<span>Trade</span>Bridge Admin</div><a class="nav" href="index.html">Shop</a></div>
<section id="login" class="panel login"><h2>Anmelden</h2><p class="muted">Mit deinem bestehenden Supabase-Adminkonto anmelden.</p><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button class="btn" onclick="login()">Anmelden</button><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden">
<div class="tabs"><button class="nav" onclick="showTab('overview')">Übersicht</button><button class="nav" onclick="showTab('products')">Produkte</button><button class="nav" onclick="showTab('orders')">Bestellungen</button><button class="nav" onclick="showTab('settings')">Shop-Zahlung</button><button class="nav" onclick="logout()">Abmelden</button></div>
<div id="overview" class="panel"></div>
<div id="products" class="panel hidden"></div>
<div id="orders" class="panel hidden"></div>
<div id="settings" class="panel hidden"></div>
</section></div>
<script>
const SB_URL="https://zhfiqjqvfviqvfqqrvsx.supabase.co";const SB_KEY="sb_publishable_yuORjifIMOyRjQq5UGi8MA_txTyLI-z";const sb=window.supabase.createClient(SB_URL,SB_KEY);
let products=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=v=>Number(v||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginMsg.textContent=error.message;return}await boot(data.user)}
async function boot(user){
 const {data}=await sb.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
 if(!data){await sb.auth.signOut();loginMsg.textContent="Dieses Konto ist kein Admin.";return}
 document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await refresh();showTab("overview");
}
async function refresh(){const r=await sb.from("products").select("*").order("created_at",{ascending:false});products=r.data||[];renderOverview();renderProducts();renderOrders();renderSettings()}
function showTab(id){["overview","products","orders","settings"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function renderOverview(){overview.innerHTML=`<h2>Übersicht</h2><div class="grid"><div class="panel"><div class="muted">Produkte</div><div class="stat">${products.length}</div></div><div class="panel"><div class="muted">Aktiv</div><div class="stat">${products.filter(x=>x.active).length}</div></div><div class="panel"><div class="muted">Niedriger Bestand</div><div class="stat">${products.filter(x=>x.stock<=3).length}</div></div></div>`}
function renderProducts(){
 const cats=["Konsolen","Grafikkarten","PC Hardware","PC","Zubehör","Handys","Tablet","Laptop","Fernseher","Monitore","Sonstiges"];
 products.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Produkte (${products.length})</h2><button class="btn" onclick="editProduct()">+ Produkt</button></div><div class="grid">${products.map(p=>`<div class="product"><img src="${esc(p.image_url||"")}" onerror="this.style.display='none'"><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ${money(p.price)} · Bestand ${p.stock}</div><div class="row" style="margin-top:9px"><button class="nav" onclick='editProduct(${JSON.stringify(p)})'>Bearbeiten</button><button class="nav danger" onclick="deleteProduct('${p.id}')">Löschen</button></div></div>`).join("")}</div>`;
}
async function editProduct(p){
 const title=p?"Produkt bearbeiten":"Neues Produkt";
 const cats=["Konsolen","Grafikkarten","PC Hardware","PC","Zubehör","Handys","Tablet","Laptop","Fernseher","Monitore","Sonstiges"];
 const html=`<div class="panel"><h2>${title}</h2><div class="formgrid">
 <input id="pn" class="full" placeholder="Name" value="${esc(p?.name)}"><select id="pc">${cats.map(c=>`<option ${p?.category===c?"selected":""}>${c}</option>`).join("")}</select><input id="pp" type="number" step="0.01" placeholder="Preis" value="${p?.price??""}"><input id="ps" type="number" placeholder="Bestand" value="${p?.stock??0}"><input id="pi" class="full" placeholder="Bild-URL" value="${esc(p?.image_url)}"><textarea id="pd" class="full" rows="8" placeholder="Beschreibung">${esc(p?.description)}</textarea></div><div class="row"><button class="btn" onclick="saveProduct('${p?.id||""}')">Speichern</button><button class="nav" onclick="refresh();showTab('products')">Abbrechen</button></div></div>`;
 products.innerHTML=html;
}
async function saveProduct(id){const obj={name:pn.value,category:pc.value,price:Number(pp.value||0),stock:Number(ps.value||0),image_url:pi.value||null,description:pd.value||"",active:true,updated_at:new Date().toISOString()};let r=id?await sb.from("products").update(obj).eq("id",id):await sb.from("products").insert(obj);if(r.error){alert(r.error.message);return}await refresh();showTab("products")}
async function deleteProduct(id){if(!confirm("Produkt wirklich löschen?"))return;const r=await sb.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);await refresh()}
async function renderOrders(){const r=await sb.from("orders").select("*").order("created_at",{ascending:false});const rows=r.data||[];orders.innerHTML=`<h2>Bestellungen (${rows.length})</h2>${rows.map(o=>`<div class="panel"><b>${esc(o.order_number||o.id)}</b> · ${money(o.total)} · ${esc(o.status)}<br>${esc(o.customer_name)} · ${esc(o.customer_email)}<br><span class="muted">${new Date(o.created_at).toLocaleString("de-DE")}</span></div>`).join("")||'<p class="muted">Keine Bestellungen.</p>'}`}
async function renderSettings(){const r=await sb.from("store_settings").select("*").eq("id",1).single();const s=r.data||{};settings.innerHTML=`<h2>Shop-Zahlung</h2><div class="formgrid"><input id="sm" placeholder="Zahlungsart" value="${esc(s.payment_method)}"><input id="sh" placeholder="Kontoinhaber" value="${esc(s.account_holder)}"><input id="sbk" placeholder="Bank" value="${esc(s.bank_name)}"><input id="si" placeholder="IBAN" value="${esc(s.iban)}"><input id="sc" placeholder="BIC" value="${esc(s.bic)}"></div><button class="btn" onclick="saveSettings()">Speichern</button>`}
async function saveSettings(){const r=await sb.from("store_settings").update({payment_method:sm.value,account_holder:sh.value,bank_name:sbk.value,iban:si.value,bic:sc.value,updated_at:new Date().toISOString()}).eq("id",1);if(r.error)alert(r.error.message);else alert("Gespeichert.")}
async function logout(){await sb.auth.signOut();location.reload()}
sb.auth.getSession().then(async ({data})=>{if(data.session)await boot(data.session.user)})
</script></body></html>

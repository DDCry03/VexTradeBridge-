<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VexTradeBridge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#05070a;--card:#0c1118;--line:#1d2733;--red:#ff304f;--text:#f5f7fa;--muted:#9aa6b2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:10;background:#080b10ee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.wrap{max-width:1250px;margin:auto;padding:16px 20px}.top{display:flex;align-items:center;gap:18px}.logo{font-size:25px;font-weight:900}.logo span{color:var(--red)}
nav{display:flex;gap:8px;overflow:auto;padding-top:12px}.navbtn{border:1px solid var(--line);background:#0b1017;color:#fff;border-radius:10px;padding:10px 14px;white-space:nowrap;cursor:pointer}.navbtn.active,.navbtn:hover{background:var(--red);border-color:var(--red)}
.hero{padding:38px 0 25px}.hero h1{font-size:clamp(32px,6vw,58px);margin:0 0 10px}.hero p{color:var(--muted);font-size:17px}.actions{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;background:#0b1017;border:1px solid var(--line);border-radius:12px;color:#fff;padding:13px 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:20px 0 50px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.pic{height:220px;background:#111821;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:contain}.body{padding:15px}.cat{font-size:12px;color:#ff7187}.name{font-weight:700;line-height:1.3;margin:6px 0 10px;min-height:42px}.desc{font-size:13px;color:var(--muted);height:38px;overflow:hidden}.price{font-size:22px;font-weight:900;margin:12px 0}.stock{font-size:12px;color:#8bd5a5}.btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.empty{padding:60px 10px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:18px}.modal.show{display:flex}.modalbox{max-width:900px;width:100%;max-height:90vh;overflow:auto;background:#0b1017;border:1px solid var(--line);border-radius:18px;padding:22px}.close{float:right;background:none;border:0;color:#fff;font-size:25px;cursor:pointer}.detail{display:grid;grid-template-columns:1fr 1fr;gap:25px}.detail img{width:100%;max-height:480px;object-fit:contain;background:#111821;border-radius:14px}.detail h2{font-size:28px}.detailtext{white-space:pre-line;color:#c5ced8;line-height:1.55}.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}.qty button{background:#151d27;color:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 9px}.form{display:grid;gap:10px}.form input,.form textarea{width:100%;background:#070b10;border:1px solid var(--line);color:#fff;border-radius:10px;padding:12px}.total{font-size:22px;font-weight:900;margin:18px 0}
@media(max-width:700px){.detail{grid-template-columns:1fr}.pic{height:190px}.wrap{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div class="logo">Vex<span>Trade</span>Bridge</div><button class="navbtn" onclick="openCart()">Warenkorb (<span id="cartCount">0</span>)</button><a class="navbtn" href="admin.html" style="text-decoration:none">Admin</a></div>
  <nav id="cats"></nav>
</div></header>
<main class="wrap">
<section class="hero">
<h1>Top Marken. Beste Preise.</h1><p>Elektronik, Gaming & Hardware schnell bei dir.</p>
<div class="actions"><input id="search" class="search" placeholder="Produkt suchen …"><button class="navbtn" onclick="loadProducts()">Zurücksetzen</button></div>
</section>
<div id="status"></div><section id="grid" class="grid"></section>
</main>

<div id="productModal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="productDetail"></div></div></div>
<div id="cartModal" class="modal" onclick="if(event.target===this)closeCart()"><div class="modalbox"><button class="close" onclick="closeCart()">×</button><h2>Warenkorb</h2><div id="cart"></div></div></div>
<div id="checkoutModal" class="modal"><div class="modalbox"><button class="close" onclick="closeCheckout()">×</button><h2>Bestellung</h2><form id="checkout" class="form"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="E-Mail" required><input name="address" placeholder="Lieferadresse" required><textarea name="note" placeholder="Hinweis (optional)"></textarea><div id="paymentInfo"></div><button class="btn">Bestellung abschicken</button></form></div></div>

<script>
const SB_URL="https://zhfiqjqvfviqvfqqrvsx.supabase.co";
const SB_KEY="sb_publishable_yuORjifIMOyRjQq5UGi8MA_txTyLI-z";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
let products=[],cart=JSON.parse(localStorage.getItem("vtb_cart")||"[]"),category="Alle";

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function money(v){return Number(v||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});}
function saveCart(){localStorage.setItem("vtb_cart",JSON.stringify(cart));updateCartCount();}
function updateCartCount(){document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0);}
function addCart(id){let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});saveCart();}
function removeCart(id){cart=cart.filter(x=>x.id!==id);saveCart();renderCart();}
function changeQty(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty=Math.max(1,x.qty+d);saveCart();renderCart();}
function openCart(){renderCart();document.getElementById("cartModal").classList.add("show")}
function closeCart(){document.getElementById("cartModal").classList.remove("show")}
function closeModal(){document.getElementById("productModal").classList.remove("show")}
function closeCheckout(){document.getElementById("checkoutModal").classList.remove("show")}

async function loadProducts(){
 const {data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});
 if(error){document.getElementById("status").textContent="Produkte konnten nicht geladen werden.";console.error(error);return}
 products=data||[]; buildCats(); render();
}
function buildCats(){
 const cats=["Alle",...new Set(products.map(p=>p.category).filter(Boolean))];
 document.getElementById("cats").innerHTML=cats.map(c=>`<button class="navbtn ${c===category?"active":""}" onclick="setCat(${JSON.stringify(c)})">${esc(c)}</button>`).join("");
}
function setCat(c){category=c;buildCats();render();}
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=products.filter(p=>(category==="Alle"||p.category===category)&&(!q||(`${p.name} ${p.category} ${p.description||""}`).toLowerCase().includes(q)));
 document.getElementById("grid").innerHTML=list.length?list.map(card).join(""):`<div class="empty">Keine Produkte gefunden.</div>`;
}
function card(p){
 return `<article class="card"><div class="pic">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:""}</div><div class="body"><div class="cat">${esc(p.category)}</div><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||"")}</div><div class="price">${money(p.price)}</div><div class="stock">${p.stock>0?`${p.stock} auf Lager`:"Nicht verfügbar"}</div><div style="display:grid;gap:8px;margin-top:12px"><button class="navbtn" onclick="openProduct('${p.id}')">Details</button><button class="btn" ${p.stock<1?"disabled":""} onclick="addCart('${p.id}')">In den Warenkorb</button></div></div></article>`;
}
function openProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 document.getElementById("productDetail").innerHTML=`<div class="detail"><div>${p.image_url?`<img src="${esc(p.image_url)}">`:""}</div><div><div class="cat">${esc(p.category)}</div><h2>${esc(p.name)}</h2><div class="price">${money(p.price)}</div><div class="detailtext">${esc(p.description||"")}</div><div style="margin-top:20px"><button class="btn" ${p.stock<1?"disabled":""} onclick="addCart('${p.id}');closeModal()">In den Warenkorb</button></div></div></div>`;
 document.getElementById("productModal").classList.add("show");
}
function renderCart(){
 if(!cart.length){document.getElementById("cart").innerHTML='<div class="empty">Dein Warenkorb ist leer.</div>';return}
 let total=0;
 const rows=cart.map(x=>{const p=products.find(p=>p.id===x.id);if(!p)return"";total+=Number(p.price)*x.qty;return `<div class="cartrow"><div><b>${esc(p.name)}</b><br><span style="color:#9aa6b2">${money(p.price)}</span></div><div class="qty"><button onclick="changeQty('${p.id}',-1)">−</button> ${x.qty} <button onclick="changeQty('${p.id}',1)">+</button></div><button class="navbtn" onclick="removeCart('${p.id}')">×</button></div>`}).join("");
 document.getElementById("cart").innerHTML=rows+`<div class="total">Gesamt: ${money(total)}</div><button class="btn" onclick="startCheckout()">Zur Kasse</button>`;
}
async function startCheckout(){
 const {data}=await sb.from("store_settings").select("*").eq("id",1).single();
 document.getElementById("paymentInfo").innerHTML=data?`<div style="padding:14px;border:1px solid #1d2733;border-radius:10px;color:#c5ced8">Zahlungsart: <b>${esc(data.payment_method||"Banküberweisung")}</b>${data.account_holder?`<br>Kontoinhaber: ${esc(data.account_holder)}`:""}${data.bank_name?`<br>Bank: ${esc(data.bank_name)}`:""}${data.iban?`<br>IBAN: ${esc(data.iban)}`:""}${data.bic?`<br>BIC: ${esc(data.bic)}`:""}</div>`:"";
 closeCart();document.getElementById("checkoutModal").classList.add("show");
}
document.getElementById("checkout").addEventListener("submit",async e=>{
 e.preventDefault();if(!cart.length)return;
 const f=new FormData(e.target),items=cart.map(x=>{const p=products.find(p=>p.id===x.id);return {id:p.id,name:p.name,price:Number(p.price),qty:x.qty}}),total=items.reduce((a,x)=>a+x.price*x.qty,0);
 const {data,error}=await sb.from("orders").insert({customer_name:f.get("name"),customer_email:f.get("email"),customer_address:f.get("address"),shipping_address:f.get("address"),note:f.get("note"),items,total}).select("order_number").single();
 if(error){alert("Bestellung konnte nicht gespeichert werden.");console.error(error);return}
 alert(`Bestellung ${data.order_number} wurde übermittelt.`);
 cart=[];saveCart();e.target.reset();closeCheckout();
});
document.getElementById("search").addEventListener("input",render);
updateCartCount();loadProducts();
</script>
</body></html>

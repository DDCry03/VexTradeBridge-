async function uploadProductImages(productId){
 const input=document.getElementById('pFiles'); if(!input?.files?.length)return[];
 if(!productId)throw new Error('Bitte zuerst das Produkt speichern.');
 const {data:existing,error:ee}=await sb.from('product_images').select('sort_order').eq('product_id',productId);
 if(ee)throw ee;
 let order=(existing||[]).reduce((m,x)=>Math.max(m,Number(x.sort_order??-1)),-1)+1;
 const urls=[];
 for(const file of [...input.files]){
  if(file.size>5*1024*1024)throw new Error(file.name+' ist größer als 5 MB.');
  if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw new Error(file.name+' hat ein nicht unterstütztes Bildformat.');
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=productId+'/'+crypto.randomUUID()+'.'+ext;
  const {error:up}=await sb.storage.from('product-images').upload(path,file,{contentType:file.type,upsert:false,cacheControl:'31536000'});
  if(up)throw new Error('Storage-Upload fehlgeschlagen: '+up.message);
  const {data:pub}=sb.storage.from('product-images').getPublicUrl(path);
  const url=pub?.publicUrl;
  if(!url)throw new Error('Keine öffentliche Bild-URL erhalten.');
  const {error:ins}=await sb.from('product_images').insert({product_id:productId,image_url:url,sort_order:order++});
  if(ins){try{await sb.storage.from('product-images').remove([path])}catch(e){};throw new Error('Bild wurde hochgeladen, konnte aber nicht in product_images gespeichert werden: '+ins.message)}
  urls.push(url);
 }
 input.value=''; const pr=document.getElementById('filePreview'); if(pr)pr.innerHTML='';
 return urls;
}
async function loadImageManager(productId){
 const box=document.getElementById('imageManager'); if(!box||!productId)return;
 const {data:rows,error}=await sb.from('product_images').select('*').eq('product_id',productId).order('sort_order',{ascending:true});
 box.style.display='block';
 if(error){box.innerHTML='<b>Bilder:</b> '+esc(error.message);return}
 const html=(rows||[]).map(r=>{
  const main=Number(r.sort_order)===0;
  const safeUrl=esc(r.image_url||'').replace(/'/g,"\\'");
  return `<div class="imageAdminItem ${main?'active':''}"><img ${imgAttrs(r.image_url,'Produktbild','')} loading="lazy"><div class="muted" style="font-size:11px;word-break:break-all">${esc(r.image_url||'')}</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px"><button type="button" class="btn ghost" onclick="setMainImage('${productId}','${r.id}','${safeUrl}')">${main?'✓ Hauptbild':'Als Hauptbild'}</button><button type="button" class="btn ghost" onclick="deleteProductImage('${r.id}','${safeUrl}')">Löschen</button></div></div>`;
 }).join('');
 box.innerHTML='<b>Gespeicherte Bilder dieses Produkts</b><div class="imageAdminGrid">'+(html||'<span class="muted">Noch keine zusätzlichen Bilder.</span>')+'</div>';
}
async function setMainImage(productId,imageId,url){
 const {error:e1}=await sb.from('product_images').update({sort_order:99}).eq('product_id',productId); if(e1){showAdminError(e1);return}
 const {error:e2}=await sb.from('product_images').update({sort_order:0}).eq('id',imageId); if(e2){showAdminError(e2);return}
 const {error:e3}=await sb.from('products').update({image_url:url}).eq('id',productId); if(e3){showAdminError(e3);return}
 await refreshAdmin(false); await loadImageManager(productId); showAdminMessage('Hauptbild geändert.','success');
}
async function deleteProductImage(id,url){
 if(!confirm('Dieses Bild wirklich löschen?'))return;
 const {data:row,error}=await sb.from('product_images').select('product_id,sort_order').eq('id',id).maybeSingle();
 if(error){showAdminError(error);return}
 const {error:del}=await sb.from('product_images').delete().eq('id',id);
 if(del){showAdminError(del);return}
 try{const marker='/storage/v1/object/public/product-images/';const i=(url||'').indexOf(marker);if(i>=0)await sb.storage.from('product-images').remove([decodeURIComponent(url.slice(i+marker.length))])}catch(e){}
 if(row?.sort_order===0&&row.product_id){
  const {data:next}=await sb.from('product_images').select('id,image_url').eq('product_id',row.product_id).order('sort_order').limit(1).maybeSingle();
  if(next?.id){await sb.from('product_images').update({sort_order:0}).eq('id',next.id);await sb.from('products').update({image_url:next.image_url}).eq('id',row.product_id)}else await sb.from('products').update({image_url:null}).eq('id',row.product_id);
 }
 await refreshAdmin(false); await loadImageManager(document.getElementById('pId')?.value||row?.product_id); showAdminMessage('Bild gelöscht.','success');
}
function clearProductForm(){
 ['pId','pName','pPrice','pCompare','pStock','pImage','pDesc'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});
 const f=document.getElementById('pFiles');if(f)f.value=''; const pr=document.getElementById('filePreview');if(pr)pr.innerHTML='';
 if(document.getElementById('pCat'))document.getElementById('pCat').value='Zubehör'; if(document.getElementById('pActive'))document.getElementById('pActive').value='true';
 const im=document.getElementById('imageManager');if(im){im.style.display='none';im.innerHTML=''};
 const st=document.getElementById('productEditorStatus');if(st)st.innerHTML='';
}
function editProductById(id){const p=(window.adminData.ps||[]).find(x=>x.id===id);if(p)editProduct(p)}
function editProduct(p){
 document.getElementById('pId').value=p.id||'';document.getElementById('pName').value=p.name||'';document.getElementById('pCat').value=categoryForProduct(p);document.getElementById('pPrice').value=p.price??'';document.getElementById('pCompare').value=p.compare_at_price??'';document.getElementById('pStock').value=p.stock??0;document.getElementById('pImage').value=p.image_url||'';document.getElementById('pDesc').value=p.description||'';document.getElementById('pActive').value=String(p.active);document.getElementById('pFiles').value='';document.getElementById('filePreview').innerHTML='';
 document.getElementById('imageManager').style.display='block';loadImageManager(p.id);window.scrollTo({top:document.getElementById('adminPanel').offsetTop,behavior:'smooth'});
}
async function toggleProductActive(id){const p=(window.adminData.ps||[]).find(x=>x.id===id);if(!p)return;const {error}=await sb.from('products').update({active:!p.active}).eq('id',id);if(error){showAdminError(error);return}p.active=!p.active;filterAdminProducts();showAdminMessage(p.active?'Produkt aktiviert.':'Produkt deaktiviert.','success');}
async function saveProduct(){
 const btn=document.getElementById('saveProductBtn'); if(btn?.disabled)return;
 if(btn){btn.disabled=true;btn.textContent='Speichert…'}
 try{
  const id=document.getElementById('pId').value.trim();
  const imageUrl=document.getElementById('pImage').value.trim()||null;
  const obj={name:document.getElementById('pName').value.trim(),category:document.getElementById('pCat').value,price:Number(document.getElementById('pPrice').value||0),compare_at_price:document.getElementById('pCompare').value?Number(document.getElementById('pCompare').value):null,stock:Number(document.getElementById('pStock').value||0),image_url:imageUrl,description:document.getElementById('pDesc').value.trim(),active:document.getElementById('pActive').value==='true'};
  if(!obj.name)throw new Error('Bitte einen Produktnamen eingeben.');
  if(!Number.isFinite(obj.price)||obj.price<0)throw new Error('Der Preis muss eine gültige Zahl ab 0 sein.');
  if(!Number.isFinite(obj.stock)||obj.stock<0)throw new Error('Der Bestand muss eine gültige Zahl ab 0 sein.');
  if(obj.compare_at_price!==null&&(!Number.isFinite(obj.compare_at_price)||obj.compare_at_price<0))throw new Error('Der Vergleichspreis ist ungültig.');
  let productId=id;
  if(id){const {error}=await sb.from('products').update(obj).eq('id',id);if(error)throw error}
  else {const {data,error}=await sb.from('products').insert(obj).select().single();if(error)throw error;productId=data.id}
  // URL im Formular immer mit dem Hauptbild-Eintrag synchronisieren.
  if(imageUrl){
   const {data:mainRows,error:me}=await sb.from('product_images').select('id').eq('product_id',productId).eq('sort_order',0).limit(1);
   if(me)throw me;
   if(mainRows?.length){const {error}=await sb.from('product_images').update({image_url:imageUrl}).eq('id',mainRows[0].id);if(error)throw error}
   else {const {error}=await sb.from('product_images').insert({product_id:productId,image_url:imageUrl,sort_order:0});if(error)throw error}
  }
  const urls=await uploadProductImages(productId);
  if(!imageUrl&&urls.length){const {error}=await sb.from('products').update({image_url:urls[0]}).eq('id',productId);if(error)throw error;const {error:me}=await sb.from('product_images').update({sort_order:0}).eq('product_id',productId).eq('image_url',urls[0]);if(me)throw me}
  await refreshAdmin(false); editProductById(productId); showAdminMessage('Produkt erfolgreich gespeichert.','success');
 }catch(e){showAdminError(e)}finally{if(btn){btn.disabled=false;btn.textContent='Speichern'}}
}
async function duplicateProduct(id){
 const p=(window.adminData.ps||[]).find(x=>x.id===id);if(!p)return;
 const copy={name:(p.name||'')+' – Kopie',category:categoryForProduct(p),price:Number(p.price||0),compare_at_price:p.compare_at_price==null?null:Number(p.compare_at_price),stock:Number(p.stock||0),image_url:p.image_url||null,description:p.description||'',active:false};
 const {data:newProduct,error}=await sb.from('products').insert(copy).select().single();if(error){showAdminError(error);return}
 const {data:imgs,error:ie}=await sb.from('product_images').select('image_url,sort_order').eq('product_id',id).order('sort_order');
 if(ie){showAdminError(ie);return}
 if(imgs?.length){const {error}=await sb.from('product_images').insert(imgs.map(x=>({product_id:newProduct.id,image_url:x.image_url,sort_order:x.sort_order})));if(error){showAdminError(error);return}}
 await refreshAdmin(false);editProductById(newProduct.id);showAdminMessage('Produkt inklusive Bilder dupliziert.','success');
}
async function deleteProduct(id){
 if(!confirm('Produkt wirklich löschen?'))return;
 const {data:imgs,error:ie}=await sb.from('product_images').select('id,image_url').eq('product_id',id);if(ie){showAdminError(ie);return}
 const {error:imgError}=await sb.from('product_images').delete().eq('product_id',id);if(imgError){showAdminError(imgError);return}
 const {error}=await sb.from('products').delete().eq('id',id);if(error){showAdminError(error);return}
 for(const im of imgs||[]){try{const marker='/storage/v1/object/public/product-images/';const i=(im.image_url||'').indexOf(marker);if(i>=0)await sb.storage.from('product-images').remove([decodeURIComponent(im.image_url.slice(i+marker.length))])}catch(e){}}
 clearProductForm();await refreshAdmin(false);showAdminMessage('Produkt gelöscht.','success');
}
async function refreshAdmin(reloadShop=true){
 const [pr,or,ir]=await Promise.all([sb.from('products').select('*').order('created_at',{ascending:false}),sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('product_images').select('*').order('sort_order')]);
 if(pr.error){showAdminError(pr.error);return false} if(or.error){showAdminError(or.error);return false} if(ir.error){showAdminError(ir.error);return false}
 window.adminData.ps=pr.data||[];window.adminData.os=or.data||[];images=ir.data||[];adminProducts();if(reloadShop)await load();return true;
}
function adminOrders(){const os=window.adminData.os||[];document.getElementById('adminPanel').innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input id="orderSearch" placeholder="Bestellungen suchen…" oninput="filterAdminOrders()" style="flex:1;min-width:220px"><select id="orderStatusFilter" onchange="filterAdminOrders()"><option value="all">Alle Status</option>${['pending','paid','processing','shipped','completed','cancelled'].map(s=>`<option value="${s}">${statusLabel(s)}</option>`).join('')}</select><button class="btn ghost" type="button" onclick="refreshOrdersAdmin()">Aktualisieren</button></div><h3>Bestellungen (<span id="orderCount">${os.length}</span>)</h3><div class="tablewrap"><table class="table"><thead><tr><th>Nr.</th><th>Kunde</th><th>Gesamt</th><th>Status</th><th>Datum</th><th>Details</th></tr></thead><tbody id="orderRows"></tbody></table></div><div id="orderDetail"></div>`;filterAdminOrders()}
async function refreshOrdersAdmin(){const btn=document.querySelector('#adminPanel button[onclick="refreshOrdersAdmin()"]');if(btn){btn.disabled=true;btn.textContent='Lädt…'}const [pr,or]=await Promise.all([sb.from('products').select('*').order('created_at',{ascending:false}),sb.from('orders').select('*').order('created_at',{ascending:false})]);if(pr.error){showAdminError(pr.error);if(btn){btn.disabled=false;btn.textContent='Aktualisieren'}return}if(or.error){showAdminError(or.error);if(btn){btn.disabled=false;btn.textContent='Aktualisieren'}return}window.adminData.ps=pr.data||[];window.adminData.os=or.data||[];adminOrders();showAdminMessage('Bestellungen aktualisiert.','success')}
function filterAdminOrders(){const os=window.adminData.os||[],q=(document.getElementById('orderSearch')?.value||'').toLowerCase(),st=document.getElementById('orderStatusFilter')?.value||'all';const rows=os.filter(o=>(st==='all'||o.status===st)&&(!q||[o.order_number,o.customer_name,o.customer_email].join(' ').toLowerCase().includes(q)));document.getElementById('orderCount').textContent=rows.length;document.getElementById('orderRows').innerHTML=rows.map(o=>`<tr><td>${esc(o.order_number||o.id)}</td><td>${esc(o.customer_name)}<br><span class="muted">${esc(o.customer_email)}</span></td><td>${euro(o.total)}</td><td><select onchange="setOrderStatus('${o.id}',this.value)">${['pending','paid','processing','shipped','completed','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></td><td>${o.created_at?new Date(o.created_at).toLocaleString('de-DE'):''}</td><td><button class="btn ghost" type="button" onclick="showOrderDetail('${o.id}')">Ansehen</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Keine Bestellungen gefunden.</td></tr>'}
function showOrderDetail(id){const o=(window.adminData.os||[]).find(x=>x.id===id);if(!o)return;let items=[];try{items=typeof o.items==='string'?JSON.parse(o.items):o.items||[]}catch(e){};document.getElementById('orderDetail').innerHTML=`<div class="notice" style="margin-top:12px"><b>Bestellung ${esc(o.order_number||o.id)}</b><br><br><b>Kunde:</b> ${esc(o.customer_name)} · ${esc(o.customer_email)}<br><b>Adresse:</b> ${esc(o.shipping_address||o.customer_address||'—')}<br><b>Notiz:</b> ${esc(o.note||'—')}<br><br><b>Artikel:</b><br>${items.map(i=>`${esc(i.name||i.product_name||i.product_id||'Artikel')} × ${Number(i.quantity||1)} · ${euro(i.price||0)}`).join('<br>')||'Keine Artikeldetails gespeichert.'}<br><br><b>Gesamt: ${euro(o.total)}</b><br><button class="btn ghost" type="button" style="margin-top:10px" onclick="document.getElementById('orderDetail').innerHTML=''">Schließen</button></div>`}
function showAdminMessage(message,type='success'){const p=document.getElementById('adminPanel');if(!p)return;const n=document.createElement('div');n.className='notice '+(type==='error'?'error':'success');n.style.marginBottom='12px';n.innerHTML=esc(message);p.prepend(n);setTimeout(()=>n.remove(),5000)}
function showAdminError(error){showAdminMessage(error?.message||String(error||'Unbekannter Fehler'),'error')}
function statusLabel(s){return ({new:'Neu',pending:'Zahlung ausstehend',paid:'Bezahlt',processing:'In Bearbeitung',shipped:'Versendet',completed:'Abgeschlossen',cancelled:'Storniert'})[s]||s}
async function setOrderStatus(id,status){const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)alert(error.message);else{const o=window.adminData.os.find(x=>x.id===id);if(o)o.status=status;filterAdminOrders()}}
async function markPaid(id){if(!confirm('Hast du den tatsächlichen Zahlungseingang auf deinem Bankkonto geprüft?'))return;await setOrderStatus(id,'paid')}
function adminSettings(){document.getElementById('adminPanel').innerHTML=`<h3>Shop-Zahlung</h3><div class="notice">Diese Daten werden beim Checkout für Banküberweisungen angezeigt.</div><div class="field"><label>Zahlungsarten</label><select id="sMethod"><option value="multiple">Banküberweisung + Karte</option><option value="bank_transfer">Nur Banküberweisung</option><option value="paypal">Nur PayPal</option></select></div><div class="field"><label>Kontoinhaber</label><input id="sHolder" value="${esc(settings.account_holder||'')}"></div><div class="field"><label>Bank</label><input id="sBank" value="${esc(settings.bank_name||'')}"></div><div class="field"><label>IBAN</label><input id="sIban" value="${esc(settings.iban||'')}"></div><div class="field"><label>BIC</label><input id="sBic" value="${esc(settings.bic||'')}"></div><div class="field"><label>PayPal-E-Mail</label><input id="sPaypal" value="${esc(settings.paypal_email||'')}"></div><button class="btn" type="button" onclick="saveSettings()">Zahlungsdaten speichern</button>`;document.getElementById('sMethod').value=settings.payment_method||'bank_transfer'}
async function saveSettings(){
 const obj={id:settings.id||1,payment_method:document.getElementById('sMethod').value,account_holder:document.getElementById('sHolder').value.trim(),bank_name:document.getElementById('sBank').value.trim(),iban:document.getElementById('sIban').value.trim(),bic:document.getElementById('sBic').value.trim(),paypal_email:document.getElementById('sPaypal').value.trim()};
 const {data,error}=await sb.from('store_settings').upsert(obj,{onConflict:'id'}).select().single();
 if(error)alert('Zahlungsdaten konnten nicht gespeichert werden: '+error.message);else{settings=data||obj;showAdminMessage('Zahlungsdaten gespeichert.','success');}
}
document.getElementById('year').textContent=new Date().getFullYear();
load();
</script>
</body>
</html>
